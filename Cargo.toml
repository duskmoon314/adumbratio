[package]
name = "adumbratio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Composable building blocks for probabilistic data structures (sketches), with the classical sketches assembled from them"

[dependencies]
libm = { version = "0.2", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
bincode = "1.3"
bloomfilter = "3.0.1"
criterion = "0.8.2"
cuckoofilter = "0.5.0"

[[bench]]
name = "sketch_ops"
harness = false

[[bench]]
name = "comparison"
harness = false

[features]
default = ["std"]
std = ["serde?/std"]
serde = ["dep:serde"]
libm = ["dep:libm"]
